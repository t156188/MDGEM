name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v1.0.12'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            suffix: arm64
          - arch: x86_64
            suffix: intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build front-end vendor bundle
        working-directory: mac/build-web
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      - name: Build .app (${{ matrix.arch }})
        working-directory: mac
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project MDGEM.xcodeproj \
            -scheme MDGEM \
            -configuration Release \
            -derivedDataPath build \
            -arch ${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Package as DMG
        working-directory: mac
        run: |
          APP="build/Build/Products/Release/MDGEM.app"
          DMG="../MDGEM-${{ matrix.suffix }}.dmg"
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MDGEM" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="MDGEM-${{ matrix.suffix }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG" || true

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.suffix }}
          path: MDGEM-${{ matrix.suffix }}.dmg
          if-no-files-found: error

  build-win:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            win/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('win/src-tauri/Cargo.lock') }}

      - name: Build viewer vendor bundle
        working-directory: mac/build-web
        run: |
          npm install
          npm run build

      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows installer
        working-directory: win/src-tauri
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: win/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.name }}
          name: MDGEM ${{ steps.tag.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
